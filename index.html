<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今天吃什么</title>
<meta name="theme-color" content="#FAF7F2">
<!-- 添加到主屏幕后以独立应用方式打开（不显示 Safari 地址栏/工具栏） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天吃什么">
<meta name="application-name" content="今天吃什么">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E8743B'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E吃%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;

    --bg: #FAF7F2;
    --bg-deep: #F4EEE5;
    --card: #FFFFFF;
    --card-soft: #FCFAF7;

    --primary: #E8743B;
    --primary-dark: #D2602A;
    --primary-soft: #FDECE0;
    --primary-ring: rgba(232, 116, 59, .16);

    --ink: #33241F;
    --text: #43312C;
    --muted: #9A8880;
    --muted-2: #B7A79F;
    --border: #ECE3DA;
    --border-soft: #F2EAE2;

    --gold: #E0A32E;
    --silver: #B9B4B0;
    --bronze: #C08355;
    --danger: #D2544F;

    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-xl: 26px;

    --sh-1: 0 1px 2px rgba(51, 36, 31, .04);
    --sh-2: 0 4px 16px rgba(51, 36, 31, .05);
    --sh-3: 0 10px 34px rgba(51, 36, 31, .07);
    --sh-primary: 0 8px 20px rgba(232, 116, 59, .26);

    --ease: cubic-bezier(.22, .61, .36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    background-image:
      radial-gradient(120% 60% at 50% -10%, #FFF5EC 0%, rgba(255, 245, 236, 0) 62%),
      radial-gradient(90% 44% at 100% 4%, #FDF1E7 0%, rgba(253, 241, 231, 0) 58%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button, input, textarea { font-family: inherit; }

  /* ================= 布局骨架 ================= */
  .container {
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 20px 0;
    padding-top: calc(20px + env(safe-area-inset-top));
    padding-left: calc(20px + env(safe-area-inset-left));
    padding-right: calc(20px + env(safe-area-inset-right));
    padding-bottom: calc(106px + env(safe-area-inset-bottom));
  }

  /* ================= 顶部 ================= */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 2px 22px;
  }
  .header-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.6px;
    line-height: 1.24;
    color: var(--ink);
  }
  .header-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 5px;
    letter-spacing: .1px;
  }
  .header-date {
    flex-shrink: 0;
    text-align: right;
    font-size: 11px;
    color: var(--muted-2);
    line-height: 1.5;
    letter-spacing: .4px;
    padding-bottom: 4px;
  }
  .header-date strong {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0;
  }

  /* ================= 视图切换 ================= */
  .view { display: none; animation: fadeUp .3s var(--ease); }
  .view.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  /* ================= 分类标签 ================= */
  .category-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .category-tab {
    position: relative;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 9px 15px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: color .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), transform .12s var(--ease);
    box-shadow: var(--sh-1);
  }
  .category-tab:active { transform: scale(.97); }
  .category-tab .cat-count {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted-2);
    transition: color .2s;
  }
  .category-tab.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(51, 36, 31, .2);
  }
  .category-tab.active .cat-count { color: rgba(255, 255, 255, .62); }

  /* ================= 抽签主卡片 ================= */
  .hero {
    position: relative;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--r-xl);
    box-shadow: var(--sh-3);
    padding: 30px 24px 26px;
    text-align: center;
    margin-bottom: 14px;
    min-height: 232px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .hero::before,
  .hero::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .hero::before {
    width: 260px; height: 260px;
    top: -150px; right: -110px;
    background: radial-gradient(circle, rgba(232, 116, 59, .10), rgba(232, 116, 59, 0) 68%);
  }
  .hero::after {
    width: 210px; height: 210px;
    bottom: -140px; left: -90px;
    background: radial-gradient(circle, rgba(224, 163, 46, .13), rgba(224, 163, 46, 0) 70%);
  }

  .hero-label {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1.4px;
    color: var(--muted-2);
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--card-soft);
    border: 1px solid var(--border-soft);
    transition: color .2s, background .2s, border-color .2s;
  }
  .hero.done .hero-label {
    color: var(--primary);
    background: var(--primary-soft);
    border-color: rgba(232, 116, 59, .2);
    letter-spacing: .6px;
  }

  .hero-main {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 18px 0 20px;
  }

  .dish-name {
    font-size: clamp(30px, 9vw, 42px);
    font-weight: 700;
    line-height: 1.24;
    letter-spacing: -.8px;
    color: var(--primary);
    overflow-wrap: anywhere;
    word-break: break-word;
    transition: opacity .12s linear, filter .12s linear, font-size .2s var(--ease);
  }
  /* 名字越长字号越小，避免长菜名把卡片撑爆 */
  .dish-name[data-len="mid"] { font-size: clamp(24px, 7.2vw, 33px); letter-spacing: -.5px; }
  .dish-name[data-len="long"] { font-size: clamp(19px, 5.6vw, 26px); letter-spacing: -.3px; line-height: 1.34; }
  .dish-name.idle {
    color: var(--muted-2);
    letter-spacing: 6px;
    font-size: clamp(26px, 7.4vw, 34px);
  }
  .dish-name.rolling {
    opacity: .42;
    filter: blur(.3px);
  }
  .dish-name.pop { animation: pop .42s var(--ease); }
  @keyframes pop {
    0% { transform: scale(.9); opacity: .3; }
    55% { transform: scale(1.045); opacity: 1; }
    100% { transform: scale(1); }
  }

  .dish-hint {
    position: relative;
    font-size: 12px;
    color: var(--muted-2);
    letter-spacing: .2px;
    min-height: 18px;
  }

  /* ================= 主按钮 ================= */
  .btn-spin {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(180deg, #F0803F 0%, var(--primary) 52%, var(--primary-dark) 100%);
    color: #fff;
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: .5px;
    cursor: pointer;
    box-shadow: var(--sh-primary);
    transition: transform .12s var(--ease), box-shadow .2s var(--ease), filter .2s;
  }
  .btn-spin:hover { filter: brightness(1.03); }
  .btn-spin:active {
    transform: translateY(1px) scale(.994);
    box-shadow: 0 4px 12px rgba(232, 116, 59, .22);
  }
  .btn-spin:disabled {
    background: var(--bg-deep);
    color: var(--muted-2);
    box-shadow: none;
    cursor: default;
    filter: none;
    transform: none;
  }
  .btn-spin .spin-icon {
    width: 17px; height: 17px;
    flex-shrink: 0;
    transition: transform .3s var(--ease);
  }
  .btn-spin:disabled .spin-icon { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ================= 抽中次数 ================= */
  .block { margin-top: 26px; }
  .block-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 0 3px 10px;
  }
  .block-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .5px;
  }
  .block-note {
    font-size: 11px;
    color: var(--muted-2);
  }

  .history-list {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-2);
    overflow: hidden;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border-soft);
  }
  .history-item:last-child { border-bottom: none; }

  .history-rank {
    width: 24px; height: 24px;
    flex-shrink: 0;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    background: var(--bg-deep);
    font-variant-numeric: tabular-nums;
  }
  .history-item.top1 .history-rank { background: linear-gradient(180deg, #F0B94A, var(--gold)); color: #fff; }
  .history-item.top2 .history-rank { background: var(--silver); color: #fff; }
  .history-item.top3 .history-rank { background: var(--bronze); color: #fff; }

  .history-name {
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .history-meta {
    flex-shrink: 0;
    text-align: right;
    line-height: 1.3;
  }
  .history-count {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
  }
  .history-count small {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--muted-2);
    margin-left: 2px;
  }
  .last-time {
    display: block;
    font-size: 10px;
    color: var(--muted-2);
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }

  .empty-box {
    padding: 30px 20px;
    text-align: center;
    color: var(--muted-2);
    font-size: 12.5px;
  }
  .empty-box svg {
    display: block;
    margin: 0 auto 10px;
    width: 34px; height: 34px;
    stroke: var(--muted-2);
    opacity: .5;
  }

  .btn-ghost {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted-2); background: rgba(255, 255, 255, .5); }
  .btn-ghost.danger { color: var(--danger); border-color: rgba(210, 84, 79, .22); }
  .btn-ghost.danger:hover { background: rgba(210, 84, 79, .05); border-color: rgba(210, 84, 79, .38); }
  .btn-ghost.accent { color: var(--primary); border-color: rgba(232, 116, 59, .24); }
  .btn-ghost.accent:hover { background: var(--primary-soft); border-color: rgba(232, 116, 59, .4); }

  /* ================= 菜单管理 ================= */
  .page-head { padding: 2px 2px 18px; }
  .page-title {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.3px;
    color: var(--ink);
  }
  .page-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.65;
  }

  .cat-card {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-2);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .cat-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
  }
  .cat-card-name {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .cat-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--primary);
    flex-shrink: 0;
  }
  .cat-card:nth-child(2) .cat-dot { background: #E9A93C; }
  .cat-card:nth-child(3) .cat-dot { background: #C9624F; }
  .cat-card:nth-child(4) .cat-dot { background: #A97C50; }

  .cat-count-pill {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    background: var(--bg-deep);
    border-radius: 999px;
    padding: 3px 10px;
    font-variant-numeric: tabular-nums;
  }
  .cat-card-body { padding: 0 16px 15px; }

  .dish-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .dish-tags:not(:empty) { margin-bottom: 13px; }
  .dish-tag {
    display: inline-flex;
    align-items: center;
    gap: 1px;
    padding: 7px 5px 7px 11px;
    background: var(--card-soft);
    border: 1px solid var(--border-soft);
    border-radius: 9px;
    font-size: 13px;
    color: var(--text);
    max-width: 100%;
    overflow-wrap: anywhere;
    transition: border-color .18s, background .18s;
  }
  .dish-tag:hover { border-color: var(--border); background: #fff; }
  .dish-tag button {
    border: none;
    background: none;
    color: var(--muted-2);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 6px;
    flex-shrink: 0;
    transition: color .18s, background .18s;
  }
  .dish-tag button:hover { color: var(--danger); background: rgba(210, 84, 79, .07); }

  .add-dish-row {
    display: flex;
    gap: 7px;
  }
  .add-dish-row input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color .18s, background .18s, box-shadow .18s;
  }
  .add-dish-row input::placeholder { color: var(--muted-2); }
  .add-dish-row input:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px var(--primary-ring);
  }
  .add-dish-row button {
    padding: 10px 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s, transform .12s;
  }
  .add-dish-row button:hover { background: var(--primary-dark); }
  .add-dish-row button:active { transform: scale(.97); }

  .bulk { margin-top: 9px; }
  .bulk summary {
    cursor: pointer;
    list-style: none;
    font-size: 12px;
    color: var(--muted);
    padding: 5px 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color .18s;
  }
  .bulk summary::-webkit-details-marker { display: none; }
  .bulk summary::before {
    content: '+';
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 5px;
    background: var(--primary-soft);
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    color: var(--primary);
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .bulk[open] summary::before { content: '−'; }
  .bulk summary:hover { color: var(--primary); }
  .bulk textarea {
    display: block;
    width: 100%;
    min-height: 86px;
    margin: 8px 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    resize: vertical;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }
  .bulk textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-ring); }
  .bulk button {
    border: 1px solid rgba(232, 116, 59, .24);
    border-radius: 9px;
    padding: 8px 14px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .18s, border-color .18s;
  }
  .bulk button:hover { background: #FBE2D4; border-color: rgba(232, 116, 59, .4); }

  /* ================= 底部导航 ================= */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, .88);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    backdrop-filter: saturate(180%) blur(18px);
    border-top: 1px solid rgba(236, 227, 218, .9);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-width: 104px;
    padding: 6px 18px;
    border: none;
    background: none;
    color: var(--muted-2);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .3px;
    cursor: pointer;
    border-radius: 12px;
    transition: color .2s var(--ease), background .2s var(--ease);
  }
  .nav-item svg { width: 21px; height: 21px; transition: transform .2s var(--ease); }
  .nav-item.active { color: var(--primary); }
  .nav-item.active svg { transform: translateY(-1px); }

  /* ================= Toast ================= */
  .toast {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) translateY(-140%);
    z-index: 200;
    max-width: 84vw;
    padding: 11px 18px;
    border-radius: 13px;
    background: rgba(51, 36, 31, .94);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: #FFF6F1;
    font-size: 13.5px;
    line-height: 1.45;
    text-align: center;
    box-shadow: 0 10px 30px rgba(51, 36, 31, .22);
    transition: transform .34s var(--ease), opacity .3s;
    opacity: 0;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ================= 窄屏 / 动效偏好 ================= */
  @media (max-width: 374px) {
    .container { padding-left: 16px; padding-right: 16px; }
    .header-title { font-size: 23px; }
    /* 窄屏去掉数量角标，四个标签等分一行 */
    .category-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .category-tab { padding: 8px 4px; font-size: 13px; gap: 0; justify-content: center; }
    .category-tab .cat-count { display: none; }
    .nav-item { min-width: 88px; padding: 6px 12px; }
    .dish-tags { gap: 6px; }
    .dish-tag { font-size: 12.5px; padding: 6px 4px 6px 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div>
      <div class="header-title" id="pageTitle">今天吃什么</div>
      <div class="header-sub" id="pageSub">好好吃饭，把选择交给这里</div>
    </div>
    <div class="header-date" id="headerDate"></div>
  </div>

  <!-- ===== 主视图：抽签 ===== -->
  <div class="view active" id="view-main">
    <div class="category-tabs" id="categoryTabs"></div>

    <div class="hero" id="dishCard">
      <span class="hero-label" id="dishLabel">今日推荐</span>
      <div class="hero-main">
        <div class="dish-name idle" id="dishName">？？？</div>
      </div>
      <div class="dish-hint" id="dishHint">点一下，让命运决定</div>
    </div>

    <button class="btn-spin" id="btnSpin">
      <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v5h-5"/>
      </svg>
      <span id="btnSpinText">开始抽签</span>
    </button>

    <div class="block">
      <div class="block-head">
        <span class="block-title">抽中次数</span>
        <span class="block-note" id="historyNote"></span>
      </div>
      <div class="history-list" id="historyList"></div>
      <button class="btn-ghost danger" id="btnClearHistory">清空历史记录</button>
    </div>
  </div>

  <!-- ===== 菜单管理视图 ===== -->
  <div class="view" id="view-manage">
    <div id="manageList"></div>
    <button class="btn-ghost accent" id="btnExport" style="margin-top:18px;">导出菜单与抽签记录</button>
  </div>

</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <button class="nav-item active" data-view="main">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 11.2 12 4.5l8 6.7V20a1 1 0 0 1-1 1h-4.6v-5.3h-4.8V21H5a1 1 0 0 1-1-1z"/>
    </svg>
    抽签
  </button>
  <button class="nav-item" data-view="manage">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h9"/><path d="M4 12h9"/><path d="M4 18h9"/>
      <path d="M17 5v4"/><path d="M15.2 7h3.6"/>
      <circle cx="17.4" cy="13.4" r="2.2"/>
      <path d="M15.5 20c.4-1.6 1.9-2.6 3.7-2.4"/>
    </svg>
    菜单
  </button>
</div>

<div class="toast" id="toast"></div>

<script>

/* ========== 常量 ========== */
const DATA_KEY = 'whatToEat_data_v3';
const LEGACY_DATA_KEY = 'whatToEat_data_v2';
const HISTORY_KEY = 'whatToEat_history_v3';
const LEGACY_HISTORY_KEY = 'whatToEat_history';
const CATEGORIES = ['早餐','午餐','晚餐','奶茶'];

/* 首次使用的默认菜单：分类 → 菜品，一层 */
const DEFAULT_DATA = {
  '早餐': ['牛肉肠','猪肝肠','猪肉肠','瘦肉汤粉','云吞面','沙县','上海小馄饨'],
  '午餐': ['卤鹅','啫啫煲','淘蛙','猪脚饭','春熙桥','凤小馆','瘦肉汤粉','云吞面','沙县','上海小馄饨'],
  '晚餐': ['卤鹅','啫啫煲','淘蛙','猪脚饭','春熙桥','凤小馆','瘦肉汤粉','云吞面','上海小馄饨','沙县','凉面','萨莉亚','韩式炸鸡','麦当劳','kfc','华莱士','塔斯汀'],
  '奶茶': ['茶理宜世','霸王茶姬','爷爷不泡茶','茉莉奶白','古茗','东方墨兰','茶月山','淡马茶坊','linlee','茶救','喜茶','英歌魂','奈雪','一点点','coco','茶百道','煲珠公','KOI','泰柯茶园','宝藏绿洲']
};

const EMPTY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8 10.6h16.4"/><path d="M4.6 10.6c0 4.1 3.3 7.4 7.4 7.4s7.4-3.3 7.4-7.4"/><path d="M9.6 19.4h4.8"/></svg>';

/* ========== 工具 ========== */
const $ = id => document.getElementById(id);
const clean = s => String(s || '').trim();
const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowTime = () => new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
// 按字数给菜名分档，长名字自动缩字号
function nameLenAttr(name){
  const n = [...String(name)].length;
  return n <= 5 ? '' : (n <= 9 ? 'mid' : 'long');
}
function load(key,fallback){ try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } }

/* ========== 数据：分类 → 菜品数组 ========== */
// 兼容旧结构（分类 → 细分 → 菜品），压平成一层，跨细分去重
function flatten(raw){
  const out = Object.create(null);
  CATEGORIES.forEach(cat=>{
    const list = [];
    const src = raw && raw[cat];
    const push = v => { if(typeof v==='string'){ const n=clean(v); if(n && !list.includes(n)) list.push(n); } };
    if(Array.isArray(src)) src.forEach(push);
    else if(src && typeof src==='object') Object.values(src).forEach(arr=>{ if(Array.isArray(arr)) arr.forEach(push); });
    out[cat] = list;
  });
  return out;
}

function readData(){
  const saved = load(DATA_KEY,null);
  if(saved && typeof saved==='object' && !Array.isArray(saved)) return flatten(saved);
  const legacy = load(LEGACY_DATA_KEY,null);
  if(legacy && typeof legacy==='object' && !Array.isArray(legacy)) return flatten(legacy);
  return flatten(DEFAULT_DATA);
}
let data = readData();

// 旧历史记录形如 "快餐 - 卤鹅"，去掉细分前缀并合并同名计数
function migrateHistory(raw){
  const out = Object.create(null);
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) return out;
  Object.entries(raw).forEach(([cat,bucket])=>{
    if(!bucket || typeof bucket!=='object' || Array.isArray(bucket)) return;
    const target = out[cat] || (out[cat] = Object.create(null));
    Object.entries(bucket).forEach(([name,val])=>{
      const text = String(name);
      const dish = text.includes(' - ') ? text.slice(text.lastIndexOf(' - ') + 3) : text;
      if(!dish) return;
      const count = Number(typeof val==='object' && val ? val.count : val) || 0;
      const lastTime = typeof val==='object' && val && val.lastTime ? val.lastTime : '';
      const prev = target[dish];
      // 合并同名菜时取更晚的时间，HH:MM 可直接按字符串比较
      const later = !prev ? lastTime : (!prev.lastTime ? lastTime : (lastTime && lastTime > prev.lastTime ? lastTime : prev.lastTime));
      target[dish] = prev
        ? { count: prev.count + count, lastTime: later }
        : { count, lastTime };
    });
  });
  return out;
}

let history = migrateHistory(load(HISTORY_KEY,null) || load(LEGACY_HISTORY_KEY,null));

/* ========== 状态 ========== */
let currentCategory = '早餐';
let rolling = false;
let timer = null, epoch = 0, toastTimer;

function persist(key,value){
  try { localStorage.setItem(key,JSON.stringify(value)); return true; }
  catch { showToast('浏览器无法保存，请先导出备份'); return false; }
}
// 首次运行把压平后的数据落盘，之后以本地数据为准
function saveData(){ persist(DATA_KEY,data); }
function saveHistory(){ persist(HISTORY_KEY,history); }

function showToast(msg){
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>$('toast').classList.remove('show'),2400);
}

/* ========== 顶部日期 ========== */
function renderHeaderDate(){
  const d = new Date();
  const week = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  $('headerDate').innerHTML = `${d.getMonth()+1}月${d.getDate()}日<strong>${week}</strong>`;
}

/* ========== 抽签 ========== */
function cancelRoll(){
  clearInterval(timer); timer = null; epoch++;
  $('dishName').classList.remove('rolling','pop');
  $('dishCard').classList.remove('done');
  rolling = false;
}
function setName(text,idle){
  const name = $('dishName');
  name.textContent = text;
  name.classList.toggle('idle', !!idle);
  const tier = nameLenAttr(text);
  if(tier) name.dataset.len = tier; else delete name.dataset.len;
}
function resetResult(){
  cancelRoll();
  const n = (data[currentCategory] || []).length;
  setName('？？？', true);
  $('dishLabel').textContent = '今日推荐';
  $('dishHint').textContent = n ? `共 ${n} 道可选 · 点一下让命运决定` : '这个餐别还没有菜品';
  $('btnSpin').disabled = false;
  $('btnSpinText').textContent = '开始抽签';
}

function spin(){
  if(rolling) return;
  const dishes = data[currentCategory] || [];
  if(!dishes.length){ showToast('这个餐别还没有菜品，去「菜单」页加几道吧'); return; }

  cancelRoll();
  rolling = true;
  const token = epoch;
  const final = dishes[Math.floor(Math.random()*dishes.length)];
  const name = $('dishName');

  $('btnSpin').disabled = true;
  $('btnSpinText').textContent = '抽取中…';
  $('dishLabel').textContent = '正在挑选';
  $('dishHint').textContent = '';
  name.classList.remove('idle');
  name.classList.add('rolling');

  let count = 0;
  timer = setInterval(()=>{
    if(token !== epoch) return;
    name.textContent = dishes[Math.floor(Math.random()*dishes.length)];
    if(++count >= 16){
      clearInterval(timer); timer = null; rolling = false;
      name.classList.remove('rolling');
      setName(final, false);
      name.classList.remove('pop');
      void name.offsetWidth;
      name.classList.add('pop');
      $('dishLabel').textContent = '就吃这个';
      $('dishCard').classList.add('done');
      $('dishHint').textContent = currentCategory + ' · ' + nowTime();
      $('btnSpin').disabled = false;
      $('btnSpinText').textContent = '再抽一次';
      record(final);
    }
  },65);
}

function record(dish){
  const bucket = history[currentCategory] || (history[currentCategory] = Object.create(null));
  const old = bucket[dish];
  const prevCount = typeof old === 'object' && old ? Number(old.count) || 0 : Number(old) || 0;
  bucket[dish] = { count: prevCount + 1, lastTime: nowTime() };
  saveHistory();
  renderHistory();
  if(navigator.vibrate) navigator.vibrate([30,50,30]);
}

$('btnSpin').addEventListener('click', spin);

/* ========== 视图切换 ========== */
const VIEW_TEXT = {
  main: ['今天吃什么', '好好吃饭，把选择交给这里'],
  manage: ['菜单管理', '按餐别维护你的候选池']
};
function switchView(name){
  resetResult();
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view === name));
  const [title,sub] = VIEW_TEXT[name] || VIEW_TEXT.main;
  $('pageTitle').textContent = title;
  $('pageSub').textContent = sub;
  $('headerDate').style.visibility = name === 'main' ? 'visible' : 'hidden';
  if(name === 'manage') renderManage();
  window.scrollTo({top:0});
}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));

/* ========== 分类标签 ========== */
function renderCategoryTabs(){
  $('categoryTabs').innerHTML = CATEGORIES.map(cat=>{
    const n = (data[cat] || []).length;
    return `<button class="category-tab ${cat===currentCategory?'active':''}" data-cat="${cat}">${cat}<span class="cat-count">${n}</span></button>`;
  }).join('');
}
$('categoryTabs').addEventListener('click',e=>{
  const b = e.target.closest('[data-cat]');
  if(!b) return;
  if(b.dataset.cat === currentCategory) return;
  currentCategory = b.dataset.cat;
  renderCategoryTabs();
  resetResult();
  renderHistory();
});

/* ========== 菜单管理 ========== */
function renderManage(){
  $('manageList').innerHTML = CATEGORIES.map(cat=>{
    const dishes = data[cat] || [];
    return `<section class="cat-card">
      <div class="cat-card-head">
        <span class="cat-card-name"><i class="cat-dot"></i>${cat}</span>
        <span class="cat-count-pill">${dishes.length} 道</span>
      </div>
      <div class="cat-card-body">
        ${dishes.length
          ? `<div class="dish-tags">${dishes.map((dish,i)=>`<span class="dish-tag">${escapeHtml(dish)}<button data-act="dish-delete" data-cat="${cat}" data-i="${i}" aria-label="删除 ${escapeHtml(dish)}">×</button></span>`).join('')}</div>`
          : `<div class="empty-box" style="padding:16px 0 18px;">${EMPTY_ICON}还没有菜品，下面加一个</div>`}
        <div class="add-dish-row">
          <input data-cat="${cat}" placeholder="输入菜名，回车添加" maxlength="30" enterkeyhint="done" autocomplete="off">
          <button data-act="dish-add" data-cat="${cat}">添加</button>
        </div>
        <details class="bulk"><summary>批量添加</summary>
          <textarea placeholder="每行一个，也支持逗号、顿号、分号分隔"></textarea>
          <button data-act="bulk-add" data-cat="${cat}">添加到${cat}</button>
        </details>
      </div>
    </section>`;
  }).join('');
}

function addItems(cat,text){
  const list = text.split(/[\r\n,，;；、]+/).map(clean).filter(Boolean);
  if(!list.length){ showToast('请输入菜名'); return false; }
  const target = data[cat] || (data[cat] = []);
  const have = new Set(target);
  let added = 0;
  list.forEach(name=>{ if(!have.has(name)){ have.add(name); target.push(name); added++; } });
  if(added) saveData();
  resetResult();
  renderCategoryTabs();
  if(added) showToast(`已添加 ${added} 道${list.length > added ? '，跳过 ' + (list.length - added) + ' 个重复' : ''}`);
  else showToast('这些菜品都已经在菜单里了');
  return true;
}

$('manageList').addEventListener('click',e=>{
  const b = e.target.closest('button[data-act]');
  if(!b) return;
  const { act, cat } = b.dataset;

  if(act === 'dish-add'){
    const field = b.parentElement.querySelector('input');
    if(!clean(field.value)){ showToast('请输入菜名'); return; }
    if(addItems(cat,field.value)){ field.value = ''; renderManage(); focusInput(cat); }
    return;
  }

  if(act === 'bulk-add'){
    const field = b.parentElement.querySelector('textarea');
    if(!clean(field.value)){ showToast('请输入菜名'); return; }
    if(addItems(cat,field.value)){ field.value = ''; renderManage(); openBulk(cat); }
    return;
  }

  if(act === 'dish-delete'){
    const i = Number(b.dataset.i);
    const dish = data[cat][i];
    if(dish === undefined) return;
    if(!confirm(`从「${cat}」里删除「${dish}」？`)) return;
    data[cat].splice(i,1);
    saveData(); resetResult(); renderCategoryTabs(); renderManage();
  }
});

// 重新渲染后把焦点放回同一个分类的输入框
function fieldOf(cat,selector){
  return [...$('manageList').querySelectorAll(selector)].find(el=>el.dataset.cat === cat);
}
function focusInput(cat){
  const el = fieldOf(cat,'.add-dish-row input');
  if(el){ el.focus(); el.scrollIntoView({block:'nearest'}); }
}
function openBulk(cat){
  const el = fieldOf(cat,'.bulk textarea');
  if(el){ const box = el.closest('details'); if(box) box.open = true; el.focus(); el.scrollIntoView({block:'nearest'}); }
}

$('manageList').addEventListener('keydown',e=>{
  if(e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT'){
    e.preventDefault();
    e.target.parentElement.querySelector('button').click();
  }
});

/* ========== 抽中次数 ========== */
function renderHistory(){
  const bucket = history[currentCategory] || {};
  const entries = Object.entries(bucket)
    .map(([name,val])=>[name, typeof val === 'number' ? {count:val,lastTime:''} : val])
    .filter(([,v])=>v && Number(v.count) > 0)
    .sort((a,b)=>b[1].count - a[1].count);

  const total = entries.reduce((s,[,v])=>s + Number(v.count), 0);
  $('historyNote').textContent = entries.length ? `${entries.length} 道 · 累计 ${total} 次` : '';

  if(!entries.length){
    $('historyList').innerHTML = `<div class="empty-box">${EMPTY_ICON}还没有抽签记录</div>`;
    return;
  }
  $('historyList').innerHTML = entries.map(([name,val],i)=>
    `<div class="history-item ${i<3?'top'+(i+1):''}">
      <div class="history-rank">${i+1}</div>
      <div class="history-name">${escapeHtml(name)}</div>
      <div class="history-meta">
        <span class="history-count">${Number(val.count)}<small>次</small></span>
        ${val.lastTime?`<small class="last-time">最近 ${escapeHtml(val.lastTime)}</small>`:''}
      </div>
    </div>`).join('');
}

$('btnClearHistory').addEventListener('click',()=>{
  const bucket = history[currentCategory] || {};
  if(!Object.keys(bucket).length){ showToast('这个餐别还没有记录'); return; }
  if(confirm(`清空「${currentCategory}」的抽中次数？`)){
    delete history[currentCategory];
    saveHistory();
    renderHistory();
  }
});

$('btnExport').addEventListener('click',()=>{
  const payload = { data, history, version: 4, exportedAt: new Date().toISOString() };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = '今天吃什么-备份.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});

/* ========== 启动 ========== */
saveData();
saveHistory();
renderHeaderDate();
renderCategoryTabs();
renderHistory();
switchView('main');

</script>
</body>
</html>
